name: Build unsigned IPA
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Archive (unsigned)
        run: |
          set -o pipefail; mkdir -p build
          xcodebuild archive \
            -project RoamControl.xcodeproj -scheme RoamControl \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/PinDrop.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | tail -n 60
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/PinDrop.xcarchive/Products/Applications/*.app Payload/
          zip -qry PinDrop-unsigned.ipa Payload
          ls -la PinDrop-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PinDrop-unsigned-ipa
          path: PinDrop-unsigned.ipa
